<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1040" width="1500" height="1040" font-family="Inter, Segoe UI, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8e9b"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0L0 5L10 10z" fill="#8a8e9b"/></marker></defs>
<rect width="1500" height="1040" fill="#07090f"/>
<text x="40" y="52" fill="#d4aa59" font-size="30" letter-spacing="10" font-weight="300">FRIDAY</text>
<text x="40" y="78" fill="#8a8e9b" font-size="14">Arquitetura: o celular é a base; o servidor em casa é retaguarda opcional. A IA propõe, o corretor decide.</text>
<text x="40" y="118" fill="#8a8e9b" font-size="12" letter-spacing="3" font-weight="600">ENTRADAS</text>
<rect x="40" y="132" width="330" height="98" rx="12" fill="#0d121b" stroke="#d4aa59" stroke-width="1.5"/>
<text x="56" y="158" fill="#d4aa59" font-size="15" font-weight="700">Painel no navegador</text>
<text x="56" y="182" fill="#e8e6df" font-size="13">voz: toque ou "Friday…" · texto</text>
<text x="56" y="201" fill="#e8e6df" font-size="13">modo mesa (celular carregando)</text>
<rect x="40" y="246" width="330" height="98" rx="12" fill="#0d121b" stroke="#d4aa59" stroke-width="1.5"/>
<text x="56" y="272" fill="#d4aa59" font-size="15" font-weight="700">Notificação com botões</text>
<text x="56" y="296" fill="#e8e6df" font-size="13">Falar · Confirmo · Cancelar</text>
<text x="56" y="315" fill="#e8e6df" font-size="13">voz nativa do Android</text>
<rect x="40" y="360" width="330" height="98" rx="12" fill="#0d121b" stroke="#d4aa59" stroke-width="1.5"/>
<text x="56" y="386" fill="#d4aa59" font-size="15" font-weight="700">Proatividade (sozinha)</text>
<text x="56" y="410" fill="#e8e6df" font-size="13">lembretes · bateria · leads novos</text>
<text x="56" y="429" fill="#e8e6df" font-size="13">briefing 08:00 · silêncio 22h–07h</text>
<rect x="40" y="474" width="330" height="74" rx="12" fill="#0d121b" stroke="#8a8e9b" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="56" y="500" fill="#8a8e9b" font-size="15" font-weight="700">Entradas passam pelo servidor local</text>
<text x="56" y="524" fill="#e8e6df" font-size="13">127.0.0.1 · chave · checagem de Host · CSP</text>
<line x1="370" y1="181" x2="450" y2="170" stroke="#8a8e9b" stroke-width="2" marker-end="url(#a)"/>
<line x1="370" y1="295" x2="450" y2="190" stroke="#8a8e9b" stroke-width="2" marker-end="url(#a)"/>
<line x1="370" y1="409" x2="450" y2="210" stroke="#8a8e9b" stroke-width="2" marker-end="url(#a)"/>
<text x="450" y="118" fill="#8a8e9b" font-size="12" letter-spacing="3" font-weight="600">DECISÃO</text>
<rect x="450" y="132" width="480" height="112" rx="12" fill="#0d121b" stroke="#b8a1ff" stroke-width="1.5"/>
<text x="466" y="158" fill="#b8a1ff" font-size="16" font-weight="700">Cérebro (IA)</text>
<text x="466" y="182" fill="#e8e6df" font-size="13">Claude na nuvem (limite diário de chamadas)</text>
<text x="466" y="201" fill="#e8e6df" font-size="13">reserva local: Ollama no celular/servidor</text>
<text x="466" y="220" fill="#e8e6df" font-size="13">propõe ferramentas; nunca executa nada</text>
<rect x="450" y="270" width="480" height="258" rx="12" fill="#0d121b" stroke="#d4aa59" stroke-width="1.5"/>
<text x="466" y="296" fill="#d4aa59" font-size="16" font-weight="700">Corretor de ferramentas</text>
<text x="466" y="320" fill="#e8e6df" font-size="13">valida cada pedido (tipos, tamanho, nomes)</text>
<text x="466" y="339" fill="#e8e6df" font-size="13">decide o NÍVEL de risco de cada ação</text>
<text x="466" y="358" fill="#e8e6df" font-size="13">dado externo lido no turno → todo nível sobe 1</text>
<text x="466" y="377" fill="#e8e6df" font-size="13">pede confirmação: voz · botão · PIN (bloqueio após 5 erros)</text>
<text x="466" y="396" fill="#e8e6df" font-size="13">pendências expiram (45 s / 120 s) · modo manutenção</text>
<text x="466" y="415" fill="#e8e6df" font-size="13">auditoria em cadeia de hashes (detecta adulteração)</text>
<text x="466" y="434" fill="#e8e6df" font-size="13">contatos só da lista · sites só públicos (bloqueia IP interno)</text>
<text x="466" y="453" fill="#e8e6df" font-size="13">arquivos só na pasta da FRIDAY, sem sobrescrever</text>
<line x1="690" y1="244" x2="690" y2="270" stroke="#8a8e9b" stroke-width="2" marker-end="url(#a)" marker-start="url(#b)"/>
<text x="990" y="118" fill="#8a8e9b" font-size="12" letter-spacing="3" font-weight="600">FERRAMENTAS POR NÍVEL</text>
<rect x="990" y="132" width="470" height="78" rx="12" fill="#0d121b" stroke="#3ecf8e" stroke-width="1.5"/>
<text x="1006" y="158" fill="#3ecf8e" font-size="15" font-weight="700">Nível 0 · lê, automático</text>
<text x="1006" y="182" fill="#e8e6df" font-size="13">hora · status do celular · lembretes · notas</text>
<text x="1006" y="201" fill="#e8e6df" font-size="13">* pesquisar_web · ler_pagina · leads (dado externo)</text>
<rect x="990" y="222" width="470" height="98" rx="12" fill="#0d121b" stroke="#4fd1ff" stroke-width="1.5"/>
<text x="1006" y="248" fill="#4fd1ff" font-size="15" font-weight="700">Nível 1 · baixo risco, automático + auditado</text>
<text x="1006" y="272" fill="#e8e6df" font-size="13">lembrete · anotar · notificar · lanterna · vibrar</text>
<text x="1006" y="291" fill="#e8e6df" font-size="13">localização · criar_arquivo (pasta isolada)</text>
<text x="1006" y="310" fill="#e8e6df" font-size="13">preparar_whatsapp (você toca em enviar)</text>
<rect x="990" y="332" width="470" height="78" rx="12" fill="#0d121b" stroke="#f5a524" stroke-width="1.5"/>
<text x="1006" y="358" fill="#f5a524" font-size="15" font-weight="700">Nível 2 · diz "confirmo" ou toca no botão</text>
<text x="1006" y="382" fill="#e8e6df" font-size="13">enviar_sms · ligar (só contatos da lista)</text>
<text x="1006" y="401" fill="#e8e6df" font-size="13">relés de potência</text>
<rect x="990" y="422" width="470" height="66" rx="12" fill="#0d121b" stroke="#e5484d" stroke-width="1.5"/>
<text x="1006" y="448" fill="#e5484d" font-size="15" font-weight="700">Nível 3 · só com PIN digitado</text>
<text x="1006" y="472" fill="#e8e6df" font-size="13">ações críticas · e nível 2 se o turno leu a internet/leads</text>
<rect x="990" y="500" width="470" height="66" rx="12" fill="#0d121b" stroke="#6b7080" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="1006" y="526" fill="#6b7080" font-size="14" font-weight="700">Nível 4 · não existe</text>
<text x="1006" y="550" fill="#e8e6df" font-size="13">shell · SQL livre · ler segredos · desligar backup</text>
<line x1="930" y1="340" x2="990" y2="340" stroke="#8a8e9b" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="600" fill="#8a8e9b" font-size="12" letter-spacing="3" font-weight="600">AUTONOMIA NO CELULAR (Termux)</text>
<rect x="40" y="614" width="700" height="150" rx="12" fill="#0d121b" stroke="#d4aa59" stroke-width="1.5"/>
<text x="56" y="640" fill="#d4aa59" font-size="15" font-weight="700">Fica de pé sozinha</text>
<text x="56" y="664" fill="#e8e6df" font-size="13">Termux:Boot liga junto com o celular → supervisor (bash)</text>
<text x="56" y="683" fill="#e8e6df" font-size="13">batimento + painel /saude: se travar, reinicia (espera cresce 5→60 s)</text>
<text x="56" y="702" fill="#e8e6df" font-size="13">wake-lock mantém o processo acordado · log com rotação</text>
<text x="56" y="721" fill="#e8e6df" font-size="13">bateria baixa avisa · horário de silêncio só notifica</text>
<text x="56" y="740" fill="#e8e6df" font-size="13">diagnóstico: python friday/main.py --diagnostico</text>
<rect x="40" y="780" width="700" height="120" rx="12" fill="#0d121b" stroke="#b8a1ff" stroke-width="1.5"/>
<text x="56" y="806" fill="#b8a1ff" font-size="15" font-weight="700">O que ela faz sozinha (sem você pedir)</text>
<text x="56" y="830" fill="#e8e6df" font-size="13">avisa lembretes e bateria baixa; resume o dia às 08:00</text>
<text x="56" y="849" fill="#e8e6df" font-size="13">avisa lead novo do site (Supabase) a cada 5 min</text>
<text x="56" y="868" fill="#e8e6df" font-size="13">tudo o que sai para outra pessoa continua pedindo confirmação</text>
<text x="790" y="600" fill="#8a8e9b" font-size="12" letter-spacing="3" font-weight="600">RETAGUARDA EM CASA (opcional)</text>
<rect x="790" y="614" width="670" height="286" rx="12" fill="#0d121b" stroke="#8a8e9b" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="806" y="640" fill="#8a8e9b" font-size="15" font-weight="700">Servidor privado (mini PC) · acesso só por Tailscale</text>
<text x="806" y="664" fill="#e8e6df" font-size="13">Ollama: modelo local sem internet e para dados sensíveis</text>
<text x="806" y="683" fill="#e8e6df" font-size="13">ntfy: push privado · Uptime Kuma: avisa se algo cair</text>
<text x="806" y="702" fill="#e8e6df" font-size="13">AdGuard Home: DNS que bloqueia rastreadores na casa</text>
<text x="806" y="721" fill="#e8e6df" font-size="13">restic: backup 3-2-1 do banco e da auditoria (diário 03:30)</text>
<text x="806" y="740" fill="#e8e6df" font-size="13">nenhuma porta aberta na internet · painéis ligados ao IP do Tailscale</text>
<text x="806" y="759" fill="#e8e6df" font-size="13">Docker: no-new-privileges, logs limitados, sem acesso ao socket</text>
<text x="806" y="778" fill="#e8e6df" font-size="13"></text>
<text x="806" y="797" fill="#e8e6df" font-size="13">Fase 0: só o celular (custo zero)  →  Fase 1: o servidor entra quando fizer sentido</text>
<text x="806" y="816" fill="#e8e6df" font-size="13">celular e servidor conversam pelo app do Tailscale</text>
<line x1="740" y1="690" x2="790" y2="690" stroke="#8a8e9b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)" marker-start="url(#b)"/>
<rect x="40" y="916" width="1420" height="96" rx="12" fill="#0d121b" stroke="#8a8e9b" stroke-width="1.5"/>
<text x="56" y="942" fill="#8a8e9b" font-size="14" font-weight="700">Memória e dados</text>
<text x="56" y="966" fill="#e8e6df" font-size="13">SQLite local (lembretes, notas, limite diário) · auditoria.jsonl · pasta friday-docs (arquivos que ela cria)</text>
<text x="56" y="985" fill="#e8e6df" font-size="13">Supabase (leads do site da Inviktus, lido com chave service_role: guarde o .env com chmod 600)</text>
</svg>