<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#01040a"><title>FRIDAY · mente</title>
<style>
:root{--bg:#01040a;--txt:#d6efff;--sub:#7d9db3;--ac:#55d6ff}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 40%,#06182a 0%,#01040a 70%);color:var(--txt);font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;width:100vw;height:100vh}
#topo{position:fixed;left:0;right:0;top:0;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:linear-gradient(#01040aee,#01040a00);pointer-events:none}
#topo b{letter-spacing:.45em;color:var(--ac);font-weight:400;font-size:14px}#topo span{color:var(--sub)}

</style></head><body>
<canvas id="c"></canvas>
<div id="topo"><b>FRIDAY</b><span id="st">mente · carregando…</span><span id="estado">—</span>
<button id="bGiro" type="button">giro: auto</button><button id="bPainel" type="button">painel</button></div>
<div id="card"><button class="x" id="fechar" type="button">×</button><h4 id="ct"></h4><p id="cd"></p><small id="cr"></small></div>
<div id="dica">Arraste para girar · pinça para aproximar · toque numa camada para ver o que ela é. Sinapses e números são reais.</div>
<div id="msg"></div>
<script>
'use strict';
// ------------------------------------------------------------------ chave (a mesma do painel); a tela só LÊ
let T='';try{const m=location.hash.match(/t=([\w-]+)/);if(m){T=m[1];try{localStorage.setItem('friday_t',T)}catch(_){}history.replaceState(null,'',location.pathname)}else{try{T=localStorage.getItem('friday_t')||''}catch(_){}}}catch(_){}
async function api(u){try{const r=await fetch(u,{headers:{'X-Friday-Token':T}});if(r.status===401){aviso('Chave inválida: abra pelo painel.');return null}return await r.json()}catch(_){return null}}
const $=id=>document.getElementById(id);
function aviso(t){$('msg').textContent=t;$('msg').style.display=t?'block':'none'}
$('bPainel').onclick=()=>{location.href='/'};
$('fechar').onclick=()=>{$('card').style.display='none';sel=null};
// ------------------------------------------------------------------ as camadas REAIS, de baixo (entrada) para cima (saída)
const COR={sent:[90,220,255],reg:[120,190,255],tr:[170,130,255],mem:[80,240,200],gru:[255,190,90],llm:[255,120,200],nuc:[120,255,160],cor:[255,110,110],sai:[230,240,255]};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
let CAMADAS=[],NOS=[],LIGS=[],SIN=[],PART=[];
let D={state:null,cer:null,mente:null,pc:null};
const SENT=[['fala','voz / texto'],['visao','câmera'],['maos','mãos'],['sistema','sistema'],['web','internet'],['interno','ela mesma']];
const PCN=['percepção','contexto','hipóteses','planejamento','crítica','verificador','aprendizagem','monitor','coordenação'];
const PCID=['percepcao','contexto','hipoteses','planejamento','critica','verificador','aprendizagem','monitor','coordenacao'];
function anel(cam,n,r,y,extra){const out=[];for(let k=0;k<n;k++){const a=k/n*Math.PI*2;const no={x:Math.cos(a)*r,y,z:Math.sin(a)*r,cam,at:0,tam:3,...(extra?extra(k):{})};out.push(no);NOS.push(no)}cam.nos=out;return out}
function montar(){
  NOS=[];LIGS=[];SIN=[];
  const m=D.mente||{},sig=m.significado||{},rot=m.rotina||{},llm=m.llm||{};
  const cer=D.cer||{nos:[],arestas:[]};
  CAMADAS=[
    {id:'sent',nome:'Sentidos',y:-300,cor:COR.sent,desc:'Por onde a informação entra: a sua voz e o texto, a câmera, os gestos das mãos, avisos do sistema, o que ela lê na internet e o que ela mesma pensa.'},
    {id:'reg',nome:'Pré-córtex · registro',y:-235,cor:COR.reg,desc:'Cada informação nova entra numa fila só na memória RAM. O assunto é tirado e a frase é jogada fora, sem ir para o disco.'},
    {id:'tr',nome:'Significado · Transformer',y:-150,cor:COR.tr,desc:'Rede pré-treinada (MiniLM, 12 camadas de atenção), congelada, mais um adaptador que é DELA e aprende com as sinapses e com as suas correções. Liga assuntos pelo sentido, não pela palavra.'},
    {id:'mem',nome:'Memória · neurônios e sinapses',y:-10,cor:COR.mem,desc:'Os neurônios reais do cofre (assuntos, notas, lembranças) e as sinapses entre eles. Sinapse usada fica forte; sinapse esquecida adormece, mas nada é apagado.'},
    {id:'gru',nome:'Rotina · GRU',y:120,cor:COR.gru,desc:'Rede recorrente com memória no tempo: lê as últimas 24 horas do registro e prevê a próxima hora. Só confia em si mesma se acertar mais que o jeito simples.'},
    {id:'nuc',nome:'Núcleo · 9 neurônios distribuídos',y:190,cor:COR.nuc,desc:'Os nove neurônios do pré-córtex distribuído conversam por mensagens: percepção, contexto, hipóteses, planejamento, crítica obrigatória, verificação, aprendizagem, monitor e coordenação.'},
    {id:'llm',nome:'Linguagem · LLM',y:255,cor:COR.llm,desc:'O modelo de linguagem grande que escreve as respostas, com o contexto da memória. Ele só PROPÕE ações: quem decide é o corretor.'},
    {id:'cor',nome:'Corretor',y:310,cor:COR.cor,desc:'Decide o que pode acontecer: níveis 0 a 3, confirmação presa à ação, auditoria do fato (não do conteúdo). O nível 4 (shell, segredos, desligar backup) não existe.'},
    {id:'sai',nome:'Saída',y:360,cor:COR.sai,desc:'A voz dela e as ações que o corretor deixou passar.'},
  ];
  const C=Object.fromEntries(CAMADAS.map(c=>[c.id,c]));
  anel(C.sent,SENT.length,170,C.sent.y,k=>({rot:SENT[k][1],chave:SENT[k][0],tam:6}));
  anel(C.reg,18,120,C.reg.y,()=>({tam:2.4}));
  // Transformer: uma lâmina por camada de atenção (12), 12 «cabeças» cada; no topo, o anel do adaptador dela
  const nCam=Math.max(1,Math.min(12,sig.camadas||1));C.tr.lam=[];
  for(let l=0;l<nCam;l++){const y=C.tr.y-48+l*(84/Math.max(1,nCam-1||1));const lam=[];for(let k=0;k<12;k++){const a=k/12*Math.PI*2+l*.26;const no={x:Math.cos(a)*92,y,z:Math.sin(a)*92,cam:C.tr,at:0,tam:1.8};lam.push(no);NOS.push(no)}C.tr.lam.push(lam)}
  C.tr.adapt=[];for(let k=0;k<24;k++){const a=k/24*Math.PI*2;const no={x:Math.cos(a)*112,y:C.tr.y+44,z:Math.sin(a)*112,cam:C.tr,at:0,tam:2.6,adapt:true};C.tr.adapt.push(no);NOS.push(no)}
  C.tr.nos=[].concat(...C.tr.lam,C.tr.adapt);
  // Memória: esfera com os neurônios REAIS (os mais ligados primeiro), sinapses REAIS
  const lista=(cer.nos||[]).map((n,i)=>({...n,i})).filter(n=>!/^Conversas\//.test(n.id)).sort((a,b)=>(b.deg||0)-(a.deg||0)).slice(0,220);
  const R=150,N=Math.max(1,lista.length),idx={};C.mem.nos=[];
  lista.forEach((n,k)=>{const yy=1-2*(k+.5)/N,r=Math.sqrt(1-yy*yy),a=k*2.39996;const prof=.55+.45*Math.min(1,(n.deg||0)/8);
    const no={x:Math.cos(a)*r*R*prof,y:C.mem.y+yy*R*.72*prof,z:Math.sin(a)*r*R*prof,cam:C.mem,at:0,tam:1.8+Math.min(4,(n.deg||0)*.45),rot:n.t,deg:n.deg||0,id:n.id};
    idx[n.i]=no;C.mem.nos.push(no);NOS.push(no)});
  for(const e of (cer.arestas||[])){const a=idx[e[0]],b=idx[e[1]];if(a&&b)SIN.push({a,b,w:Math.min(1,(e[2]||1)/6)})}
  // GRU: anel recorrente com as unidades de memória dela
  anel(C.gru,rot.oculto||24,105,C.gru.y,()=>({tam:2.6}));
  anel(C.nuc,9,120,C.nuc.y,k=>({rot:PCN[k],chave:PCID[k],tam:5}));
  C.llm.nos=[];const o={x:0,y:C.llm.y,z:0,cam:C.llm,at:0,tam:14,rot:llm.modelo||'LLM'};C.llm.nos.push(o);NOS.push(o);
  anel(C.cor,5,95,C.cor.y,k=>({rot:'nível '+k,tam:k===4?3:5,proibido:k===4}));
  anel(C.sai,2,60,C.sai.y,k=>({rot:k?'ações':'voz',tam:6}));
  // caminhos do código: cada camada fala com a de cima
  for(let i=0;i<CAMADAS.length-1;i++){const A=CAMADAS[i].nos,B=CAMADAS[i+1].nos;if(!A.length||!B.length)continue;
    const n=Math.min(40,A.length*3);for(let k=0;k<n;k++){const a=A[(Math.random()*A.length)|0],b=CAMADAS[i+1].id==='cor'?B[(Math.random()*4)|0]:B[(Math.random()*B.length)|0];LIGS.push({a,b,cor:CAMADAS[i].cor})}}
  textos();
}
// ------------------------------------------------------------------ dados ao vivo
let ultConv=null,estadoIA='';
async function vivo(){
  const s=await api('/state');if(s){D.state=s;aviso('')}
  const p=await api('/precortex/estado');if(p&&p.ok)D.pc=p;
  if(!s&&!p){aviso('Sem conexão com a FRIDAY.');return}
  const e=(s&&s.estado)||'';$('estado').textContent=e||'—';
  if(e!==estadoIA){estadoIA=e;if(/pens/.test(e))onda('sent',.9);if(/fal/.test(e))acender('sai',1)}
  const conv=s&&s.voce;if(conv&&conv!==ultConv){if(ultConv!==null)onda('sent',1);ultConv=conv}
  const nuc=s&&s.nucleo;if(nuc){const f=nuc.foco||[];for(const x of f){const n=CAM('sent').nos.find(v=>v.chave===x.origem);if(n)n.at=Math.max(n.at,Math.min(1,.4+(x.peso||0)))}}
  if(D.pc)for(const n of D.pc.neuronios||[]){const no=CAM('nuc').nos.find(v=>v.chave===n.nome);if(no&&n.estado!=='ocioso')no.at=1}
  const pf=s&&s.prefrontal;
  textos();
}
async function cerebro(){const c=await api('/cerebro');if(c&&c.nos){const k=c.nos.length+':'+c.arestas.length;if(k!==cerebro.k){cerebro.k=k;D.cer=c;montar()}}}
async function mente(){const m=await api('/mente/dados');if(m&&m.ok){const k=JSON.stringify(m);if(k!==mente.k){mente.k=k;D.mente=m;montar()}}}
const CAM=id=>CAMADAS.find(c=>c.id===id)||{nos:[]};
function textos(){
  const m=D.mente||{},sig=m.significado||{},rot=m.rotina||{},llm=m.llm||{},mem=(D.state&&D.state.memoria)||{};
  const C=Object.fromEntries(CAMADAS.map(c=>[c.id,c]));if(!C.mem)return;
  C.sent.real='6 entradas';
  C.reg.real=`fila agora: ${m.fila_assimilacao||0}`;
  C.tr.real=sig.motor==='transformer'?`MiniLM · ${sig.camadas} camadas · limiar ${sig.limiar} · ${sig.indexadas} notas indexadas`:sig.motor==='desligado'?'desligado':`rede própria (${sig.motor})`;
  C.mem.real=`${mem.neuronios||C.mem.nos.length} neurônios · ${mem.sinapses||SIN.length} sinapses${C.mem.nos.length<(mem.neuronios||0)?` · ${C.mem.nos.length} mais ligados à vista`:''}`;
  C.gru.real=rot.treinada?(rot.confiavel?('próxima hora: '+(rot.previsao||[]).map(p=>`${p.rotulo} ${Math.round(p.chance*100)}%`).join(', ')):`${rot.dias} dias · ainda aprendendo`):`juntando dados: ${rot.status||''}`;
  C.nuc.real=(D.pc&&D.pc.neuronios)?`${D.pc.neuronios.filter(n=>n.estado!=='ocioso').length} trabalhando agora`:'9 neurônios';
  C.llm.real=`${llm.provedor||''} · ${llm.modelo||''} · modo ${llm.modo||''}`;
  C.cor.real=`${(D.state&&D.state.ferramentas)||0} ferramentas sob o corretor`;
  C.sai.real=(D.state&&D.state.estado)||'';
  $('st').textContent=`mente · ${mem.neuronios||0} neurônios · ${mem.sinapses||0} sinapses · ${sig.motor||''}`;
  if(sel)mostrar(sel);
}
function acender(id,v){for(const n of CAM(id).nos)n.at=Math.max(n.at,v)}
// uma «onda» de pensamento: sobe camada por camada, como o pedido de verdade passa pelo código
function onda(de,v){const i=CAMADAS.findIndex(c=>c.id===de);CAMADAS.slice(i).forEach((c,k)=>setTimeout(()=>{acender(c.id,v);for(let j=0;j<14;j++)disparo(c)},k*260))}
function disparo(c){const ls=LIGS.filter(l=>l.a.cam===c);if(ls.length)PART.push({l:ls[(Math.random()*ls.length)|0],t:0,v:.012+Math.random()*.012})}
// ------------------------------------------------------------------ câmera 3D (projeção própria: sem bibliotecas, sem eval)
const cv=$('c'),g=cv.getContext('2d');let W=0,H=0,DPR=1;
function tamanho(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',tamanho);tamanho();
let yaw=.6,pitch=-.32,dist=900,auto=true,alvoYaw=null;
const REDUZ=matchMedia('(prefers-reduced-motion: reduce)').matches;
$('bGiro').onclick=()=>{auto=!auto;$('bGiro').textContent='giro: '+(auto?'auto':'parado')};
function proj(x,y,z){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  let X=x*cy-z*sy,Z=x*sy+z*cy;let Y=(y-30)*cp-Z*sp;Z=(y-30)*sp+Z*cp;const f=Math.min(W*2.2,H)*.95/(dist+Z);return{x:W/2+X*f,y:H/2-Y*f,s:f,z:Z}}
// toque: arrastar gira, pinça aproxima, toque curto escolhe a camada
let pts=new Map(),ini=null,moveu=false,pinca=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);ini=[e.clientX,e.clientY];moveu=false});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const [px,py]=pts.get(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinca)dist=Math.max(380,Math.min(1800,dist*pinca/d));pinca=d;moveu=true;return}
  const dx=e.clientX-px,dy=e.clientY-py;if(Math.abs(e.clientX-ini[0])+Math.abs(e.clientY-ini[1])>6)moveu=true;yaw+=dx*.008;pitch=Math.max(-1.2,Math.min(1.2,pitch+dy*.006))});
const solta=e=>{pts.delete(e.pointerId);if(pts.size<2)pinca=0;if(!moveu&&e.type==='pointerup')tocar(e.clientX,e.clientY)};
cv.addEventListener('pointerup',solta);cv.addEventListener('pointercancel',solta);
cv.addEventListener('wheel',e=>{dist=Math.max(380,Math.min(1800,dist*(1+e.deltaY*.001)));e.preventDefault()},{passive:false});
let sel=null,ROTULOS=[];
function tocar(x,y){let melhor=null,md=1e9;for(const r of ROTULOS){const d=Math.hypot(r.x-x,r.y-y);if(d<md){md=d;melhor=r}}
  if(melhor&&md<70){sel=melhor.c;mostrar(sel);onda(sel.id,.8)}else{$('card').style.display='none';sel=null}}
function mostrar(c){$('ct').textContent=c.nome;$('cd').textContent=c.desc;$('cr').textContent='agora: '+(c.real||'');$('card').style.display='block';$('dica').style.display='none'}
// ------------------------------------------------------------------ desenho
let t0=performance.now(),ult=0;
function quadro(t){
  requestAnimationFrame(quadro);if(t-ult<30)return;const dt=Math.min(.1,(t-ult)/1000);ult=t;
  if(auto&&!pts.size&&!REDUZ)yaw+=dt*.12;
  g.clearRect(0,0,W,H);
  const P=new Map();for(const n of NOS){P.set(n,proj(n.x,n.y,n.z));n.at*=Math.pow(.25,dt)}
  // eixo central (a «coluna» por onde o pedido sobe)
  const a0=proj(0,-320,0),a1=proj(0,380,0);g.strokeStyle='rgba(85,214,255,.12)';g.lineWidth=2;g.beginPath();g.moveTo(a0.x,a0.y);g.lineTo(a1.x,a1.y);g.stroke();
  // anéis-guia de cada camada
  for(const c of CAMADAS){const r=c.id==='mem'?150:c.id==='sent'?170:c.id==='nuc'?120:c.id==='reg'?120:c.id==='gru'?105:c.id==='tr'?112:c.id==='cor'?95:60;
    if(c.id==='llm')continue;g.strokeStyle=rgba(c.cor,c===sel?.45:.12);g.lineWidth=c===sel?1.6:1;g.beginPath();
    for(let k=0;k<=48;k++){const a=k/48*Math.PI*2,p=proj(Math.cos(a)*r,c.id==='mem'?c.y:c.y,Math.sin(a)*r);k?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)}g.stroke()}
  // caminhos do código (fracos) e sinapses reais (mais fortes)
  g.lineWidth=1;
  for(const l of LIGS){const a=P.get(l.a),b=P.get(l.b);if(!a||!b)continue;g.strokeStyle=rgba(l.cor,.035+(l.a.at+l.b.at)*.12);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
  for(const s of SIN){const a=P.get(s.a),b=P.get(s.b);g.strokeStyle=rgba(COR.mem,.08+s.w*.35+(s.a.at+s.b.at)*.25);g.lineWidth=.6+s.w*1.6;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
  // GRU: a memória girando no anel (recorrência)
  const gru=CAM('gru');if(gru.nos.length){const fase=(t/1000)%1;gru.nos.forEach((n,k)=>{const q=(k/gru.nos.length+fase)%1;n.at=Math.max(n.at,q>.92?.7:0)})}
  // Transformer: a atenção passa lâmina por lâmina
  const tr=CAM('tr');if(tr.lam){const L=tr.lam.length,i=Math.floor((t/180)%(L+4));if(i<L)for(const n of tr.lam[i])n.at=Math.max(n.at,.55)}
  // partículas (o sinal subindo)
  if(!REDUZ&&PART.length<260&&LIGS.length&&Math.random()<.5)PART.push({l:LIGS[(Math.random()*LIGS.length)|0],t:0,v:.006+Math.random()*.01});
  PART=PART.filter(p=>{p.t+=p.v*(dt*60);if(p.t>=1){p.l.b.at=Math.max(p.l.b.at,.5);return false}const a=P.get(p.l.a),b=P.get(p.l.b);if(!a||!b)return false;
    const x=a.x+(b.x-a.x)*p.t,y=a.y+(b.y-a.y)*p.t;g.fillStyle=rgba(p.l.cor,.85);g.beginPath();g.arc(x,y,1.6,0,7);g.fill();return true});
  // nós, do fundo para a frente
  const ord=[...NOS].sort((a,b)=>P.get(b).z-P.get(a).z);
  for(const n of ord){const p=P.get(n),c=n.cam.cor,r=Math.max(.8,n.tam*p.s*.9),br=Math.min(1,.35+n.at);
    if(n.cam.id==='llm'){const pul=1+.08*Math.sin(t/300)+n.at*.3;const gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,r*3.2*pul);gr.addColorStop(0,rgba(c,.95));gr.addColorStop(.35,rgba(c,.35));gr.addColorStop(1,rgba(c,0));g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y,r*3.2*pul,0,7);g.fill();continue}
    if(n.at>.2){g.fillStyle=rgba(c,n.at*.25);g.beginPath();g.arc(p.x,p.y,r*3,0,7);g.fill()}
    g.fillStyle=n.proibido?'rgba(255,80,80,.25)':rgba(c,br);g.beginPath();g.arc(p.x,p.y,r,0,7);g.fill();
    if(n.proibido){g.strokeStyle='rgba(255,90,90,.7)';g.lineWidth=1.2;g.beginPath();g.moveTo(p.x-r*1.6,p.y-r*1.6);g.lineTo(p.x+r*1.6,p.y+r*1.6);g.stroke()}
    if(n.rot&&(n.cam.id!=='mem'||n.deg>=7||n.at>.6)&&p.s>.7){g.fillStyle=rgba(c,.75);g.font='10px ui-monospace,monospace';g.fillText(String(n.rot).slice(0,22),p.x+r+3,p.y+3)}}
  // nome de cada camada (toque para ver)
  ROTULOS=[];const pequeno=W<600;
  for(const c of CAMADAS){const r=c.id==='mem'?165:c.id==='sent'?185:135;const p=proj(r*Math.cos(-yaw-.0)+0,c.y,0);
    const q=proj(0,c.y,0),x=pequeno?10:Math.min(W-200,Math.max(q.x+Math.abs(p.x-q.x)+16,0)),y=q.y;
    g.fillStyle=rgba(c.cor,c===sel?1:.85);g.font=(pequeno?'10px':'11px')+' ui-monospace,monospace';g.fillText(c.nome,x,y);
    if(c.real&&!pequeno){g.fillStyle='rgba(125,157,179,.85)';g.fillText(String(c.real).slice(0,60),x,y+13)}
    ROTULOS.push({x:x+40,y,c});g.strokeStyle=rgba(c.cor,.25);g.beginPath();g.moveTo(q.x,q.y);g.lineTo(x-4,y-3);g.stroke()}
}
// ------------------------------------------------------------------ partida
(async()=>{await mente();await cerebro();if(!CAMADAS.length)montar();await vivo();requestAnimationFrame(quadro);
  setInterval(vivo,2000);setInterval(mente,15000);setInterval(cerebro,20000)})();
</script>
